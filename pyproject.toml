[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fintech2026"
version = "0.1.0"
description = "Office agent: chat → frozen task → scheduled, deterministic runs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "jinja2>=3.1",
    "jsonpatch>=1.33",
    "jsonschema>=4.23",
    "apscheduler>=3.10,<4",
    "keyring>=25.0",
    "cryptography>=43.0",
    "python-docx>=1.1",
    "docxtpl>=0.18",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "matplotlib>=3.9",
    "tzdata>=2026.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = [
    "common",
    "main",
    "agent_loop",
    "compiler",
    "runner",
    "executor",
    "scheduler",
    "internal_tools",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
